# Verifies pull requests without deployment jobs or credentials.
# The standalone Verify result preserves the existing required-check context.
name: Verify PR
on:
  pull_request: null
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: PR checks
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@c1ad9103aefc48c7694499aa1577e3266d7c6af8
    with:
      automation_sha: 805b0237cfdb15d356e0b6700321d038620f022e
      source_sha: ${{ github.sha }}
      environment: dev
      node_version: '24'
  verify_result:
    name: Verify
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful PR checks
        run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
