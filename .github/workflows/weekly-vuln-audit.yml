# Runs weekly/manual vulnerability checks using pinned shared CI/CD logic.
# Calls the shared vulnerability audit weekly or manually; no fixes or deployment.
name: Weekly vulnerability audit
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-vuln-audit
  cancel-in-progress: false
jobs:
  audit:
    name: Audit vulnerabilities
    uses: benhammoush/ci-cd-workflows/.github/workflows/weekly-vuln-audit.yml@805b0237cfdb15d356e0b6700321d038620f022e
    with:
      node_version: '24'
