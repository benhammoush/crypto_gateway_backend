# Manually verifies and releases an exact dev-accepted source revision to production.
# Calls shared CI/CD workflows with native environment approval.
name: Verify and deploy to prod
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA already delivered and accepted in dev
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify_release:
    name: Production checks
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@805b0237cfdb15d356e0b6700321d038620f022e
    with:
      automation_sha: 805b0237cfdb15d356e0b6700321d038620f022e
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: '24'
  deploy_production:
    name: Production delivery
    needs: verify_release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-worker.yml@805b0237cfdb15d356e0b6700321d038620f022e
    with:
      automation_sha: 805b0237cfdb15d356e0b6700321d038620f022e
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: '24'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
