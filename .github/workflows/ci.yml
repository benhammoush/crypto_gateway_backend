# Generated by the pinned ci-cd-workflows template renderer.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits workflow structure without comments. See DELIVERY.md for operations.
# Shared foundation owns release safeguards; Gateway owns payment/schema checks.
name: CI
on:
  # Shared: PRs verify only; native required checks/review gate a human merge.
  pull_request: null
  # Shared: a merge triggers fresh checks of that exact main commit before dev.
  push:
    branches:
      - main
  # Shared: dev revalidation/recovery takes a full merged SHA, never a moving ref.
  # Production has its own manual workflow; this entry point cannot select it.
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA to revalidate and redeploy in dev
        type: string
        required: true
# Shared: source/Actions reads only, with no merge or repository-admin permission.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: immutable Worker verification runs the application-owned ci:* hooks
  # and retains the checked bundle and configuration/artifact identity.
  # Project: ci:quality runs lint/format/types, API/payment/failure-path tests,
  # dry-run build and dependency audit; backend risk does not require browsers.
  # Project: the dry-run build inside ci:quality produces dist; shared verification
  # captures that prebundled Worker for --no-bundle delivery (no ci:prepare hook).
  # D1 schema changes are separate reviewed migrations, not part of this build.
  verify:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@1d4b201fc53f05c53de2fdc37ab9b184b676a1be
    with:
      # Shared: implementation checkout matches this workflow's immutable SHA.
      automation_sha: 1d4b201fc53f05c53de2fdc37ab9b184b676a1be
      # Shared: exact manual selection or the PR/main event revision.
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      # Project: Gateway's supported Node toolchain.
      node_version: "24"
  # Shared: successful main push/manual dev checks precede any enabled delivery.
  # The called job binds dev and shares deploy-<owner>-<repository>-dev with
  # bootstrap-dev.yml/migrate-dev.yml; active operations are not cancelled.
  # Project: scripts/ci-deploy.mjs retains isolated Worker/D1 configuration and
  # migration-digest guards, followed by read-only health/readiness smoke.
  # This path does not provision D1, apply SQL or create/submit/settle payments.
  # Disabled targets remain disabled; first bootstrap/migrations need separate approval.
  deploy_dev:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-worker.yml@1d4b201fc53f05c53de2fdc37ab9b184b676a1be
    with:
      automation_sha: 1d4b201fc53f05c53de2fdc37ab9b184b676a1be
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: "24"
    # Shared: pass named secrets only; selected environment credentials stay out
    # of verification. IRIS_REFRESH_TOKEN is part of the shared Worker interface;
    # Gateway's adapter does not consume it or perform Iris refresh operations.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
  # Project: retain quality as the native required-check compatibility name.
  # Shared: reflect verify even on failure, without rerunning the application gate.
  legacy_0:
    name: quality
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
