name: Apply first dev schema (manual)
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact reviewed current-main SHA for the first dev migration
        type: string
        required: true
      confirm_first_dev_migration:
        description: Apply only 0001_payments.sql to the uninitialized dev database
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: dev
      deployment: false
    concurrency:
      group: deploy-${{ github.repository_owner }}-${{ github.event.repository.name }}-dev
      cancel-in-progress: false
    steps:
      - name: Require exact reviewed source and a fresh explicit dispatch
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.sha }}
          CONFIRM_FIRST_DEV_MIGRATION: ${{ inputs.confirm_first_dev_migration }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CONFIRM_FIRST_DEV_MIGRATION" = true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate first-dev state, apply the reviewed migration and read it back
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.sha }}
          CONFIRM_FIRST_DEV_MIGRATION: ${{ inputs.confirm_first_dev_migration }}
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          OTHER_D1_DATABASE_ID: ${{ vars.OTHER_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATION_TOKEN }}
        run: node scripts/migrate-dev.mjs
