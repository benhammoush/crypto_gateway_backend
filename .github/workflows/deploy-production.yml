# Generated by the pinned ci-cd-workflows v1.0.1 template renderer.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits structure without comments. DELIVERY.md owns setup/payment/recovery acceptance.
name: Deploy production
on:
  # Shared: manually dispatch from main; merging only enters the separate dev path.
  # Project: backend and frontend release their own compatible SHAs, backend first.
  workflow_dispatch:
    inputs:
      # Shared: full merged backend SHA already delivered successfully to dev.
      # Retained evidence is required; actual acceptance/recovery remain owner checks.
      sha:
        description: Exact merged source SHA already delivered and accepted in dev
        type: string
        required: true
# Shared: read source ancestry and Actions evidence, not administration or merging.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: validate merged source/exact dev evidence before candidate checks.
  # Project: ci:quality retains API/payment/failure-path, type/lint/audit and dry-run
  # build checks; that build produces dist, which shared verification retains as
  # the tested prebundled Worker artifact (this project has no ci:prepare hook).
  # No production provider credentials reach these verification steps.
  # Project: schema migration, first-code bootstrap and provisioning remain separate
  # approved operations. Passing this job does not create a Worker or initialize D1.
  verify_release:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@37151e604a66c0dbb68b5631534c7124d4d95798
    with:
      # Shared: fixed implementation revision must match the reusable workflow pin.
      automation_sha: 37151e604a66c0dbb68b5631534c7124d4d95798
      source_sha: ${{ inputs.sha }}
      # Shared: select production configuration explicitly, never an arbitrary target.
      environment: production
      node_version: "24"
  # Shared: the called job binds production and waits for native approval after
  # verification. GitHub settings own reviewer/main-only/no-admin-bypass policy.
  # Recheck dev evidence/source/artifact identity after approval; honor enablement
  # and serialize production mutations without cancelling an active operation.
  # Project: ci-deploy.mjs validates isolated Worker/D1 IDs, managed configuration
  # and migration-set digest, deploys checked bytes with --no-bundle, then reads
  # health/readiness. It never applies migrations or creates/settles a payment.
  # Production hosting remains Solana DEVNET-only, not authorization for real funds.
  # Missing setup/disabled targets stay blocked/off. Uncertain mutations require
  # investigation and new dispatch/approval, not blind retry or automatic rollback.
  deploy_production:
    needs: verify_release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-worker.yml@37151e604a66c0dbb68b5631534c7124d4d95798
    with:
      automation_sha: 37151e604a66c0dbb68b5631534c7124d4d95798
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: "24"
    # Shared: named production credentials only; no dev verification token/PAT.
    # IRIS_REFRESH_TOKEN is exposed by the generic Worker interface but unused by
    # Gateway's adapter; payment/runtime secrets remain provider-managed separately.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
